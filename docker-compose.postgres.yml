services:
  postgres:
    image: postgres:16-alpine
    container_name: pantry-pal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pantrypal
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: pantry_local_dev
    ports:
      - "5432:5432"
    volumes:
      - pantry-pal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantry -d pantrypal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pantry-pal-postgres-data:
