name: Publish container

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  APP_NAME: pantry-pal
  DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT || 'dev' }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Resolve application version
        shell: bash
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Generate image metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Enable this step after the GitOps repository is configured.
      # Required configuration:
      # - secret: GITOPS_REPO_TOKEN
      # - repository variable: GITOPS_REPOSITORY (owner/repository)
      # - optional repository variable: DEPLOY_ENVIRONMENT
      # - name: Dispatch image update to GitOps
      #   if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')
      #   uses: peter-evans/repository-dispatch@v4
      #   with:
      #     token: ${{ secrets.GITOPS_REPO_TOKEN }}
      #     repository: ${{ vars.GITOPS_REPOSITORY }}
